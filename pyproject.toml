[project]
name = "source-aware-intelligence-hub"
version = "1.0.0"
description = "Synthetic source-aware decision support demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==9.0.3",
  "ruff==0.12.10",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["backend/tests", "tools/tests"]

[tool.ruff]
line-length = 100
exclude = ["frontend/dist", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["backend.app", "tools"]
